name: "ISC Kea DHCP Server"
version: "2.1.7"
slug: "isc_kea_dhcp"
description: "ISC Kea Dual-Stack DHCP Server (DHCPv4 + optional DHCPv6) with Web UI"
url: "https://github.com/raphael1688dev/ha_app_kea"
arch:
  - amd64
  - aarch64
# Minimum Home Assistant Core version. The real requirement is Supervisor 2026.07 (the `app_config` map type below,
# which older Supervisors silently do not mount), but the Supervisor has no minimum-Supervisor key, so the Core
# version is the proxy. Older Home Assistant versions are not offered this app.
homeassistant: "2026.7.0"
init: false
stage: experimental
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:server-network"
panel_title: "Kea DHCP"
privileged:
  - NET_ADMIN
  - NET_RAW
map:
  - app_config:rw
# Initial defaults only: after the first save in the Web UI, interface and DHCPv6 are managed there (Settings tab).
options:
  interface: "eth0"
  enable_dhcp6: false
schema:
  interface: str
  enable_dhcp6: bool
