name: "ISC Kea DHCP Server"
version: "2.0.0"
slug: "isc_kea_dhcp"
description: "ISC Kea Dual-Stack DHCP Server (DHCPv4 + optional DHCPv6) with Web UI"
url: "https://github.com/raphael1688dev/ha_app_kea"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:server-network"
panel_title: "Kea DHCP"
privileged:
  - NET_ADMIN
  - NET_RAW
  - NET_BIND_SERVICE
map:
  - config:rw
# 部署層級設定。網段、Pool、DNS、靜態綁定等營運設定請至側邊欄「Kea DHCP」Web UI 管理。
options:
  interface: "eth0"
  enable_dhcp6: false
schema:
  interface: str
  enable_dhcp6: bool
