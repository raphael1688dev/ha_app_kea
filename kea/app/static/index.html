<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kea DHCP</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --fg: #1c1c1e; --muted: #6b7280; --line: #e2e5ea;
    --accent: #03a9f4; --accent-fg: #fff; --danger: #d32f2f; --ok: #2e7d32; --warn: #ed6c02;
    --input-bg: #fff; --err-bg: #fdecea; --warn-bg: #fff4e5; --log-bg: #0f1115; --log-fg: #d6dae0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1c1f26; --fg: #e8eaed; --muted: #9aa0a6; --line: #2d313a;
      --input-bg: #14171c; --err-bg: #3b1f1f; --warn-bg: #3a2c14;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h3 { margin: 0; font-size: 15px; }
  h4 { margin: 14px 0 4px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px;
          border: 1px solid var(--line); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--ok); } .dot.down { background: var(--danger); }
  button, .btn { font: inherit; cursor: pointer; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--fg); text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.danger { color: var(--danger); }
  button.sm { padding: 2px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 14px 0; border-bottom: 1px solid var(--line); }
  nav button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 8px 16px; }
  nav button.active { border-bottom-color: var(--accent); font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  input, select { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--input-bg); color: var(--fg); }
  input[type=checkbox] { width: auto; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); }
  td input { min-width: 110px; }
  td input[type="checkbox"] { min-width: 0; width: auto; margin: 0; }
  th.sel, td.sel { width: 1%; padding-right: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .scroll { overflow-x: auto; }
  .nowrap { white-space: nowrap; }
  .span { grid-column: 1 / -1; }
  .tag { margin-left: 6px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
             background: var(--input-bg); color: var(--fg); }
  td.good { color: var(--ok); } td.bad { color: var(--danger); } td.warnc { color: var(--warn); }
  .banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; white-space: pre-wrap; }
  .banner.err { background: var(--err-bg); border: 1px solid var(--danger); }
  .banner.warn { background: var(--warn-bg); border: 1px solid var(--warn); }
  .banner ul { margin: 4px 0 0; padding-left: 20px; }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; border-top: 1px solid var(--line);
             display: flex; gap: 10px; align-items: center; }
  .empty { padding: 16px; text-align: center; color: var(--muted); }
  details { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  summary { cursor: pointer; font-weight: 600; }
  .logbox { background: var(--log-bg); color: var(--log-fg); border-radius: 8px; padding: 10px; height: 460px;
            overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
            word-break: break-all; }
  .logbox .err { color: #ff8a80; } .logbox .warn { color: #ffcc80; } .logbox .src { color: #7fb7ff; }
  .toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); max-width: 90vw;
           background: #323232; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 10;
           box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .toast.err { background: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ISC Kea DHCP</h1>
  <div id="banner"></div>
  <div id="kerr"></div>
  <div class="card row" id="statusbar"></div>
  <nav id="tabs"></nav>
  <section id="view"></section>
  <div class="savebar" id="savebar" hidden>
    <button class="primary" id="save">Save &amp; apply</button>
    <button id="discard">Discard changes</button>
    <span class="muted" id="savemsg">You have unsaved changes</span>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// All URLs are relative (no leading slash) so the page works under HA Ingress.
const API = (p) => "api/" + p;
const TABS = [["dhcp4", "IPv4"], ["dhcp6", "IPv6"], ["leases", "Leases"], ["logs", "Logs"], ["settings", "Settings"]];
const LOG_SOURCES = [["", "All"], ["dhcp4", "Kea DHCPv4"], ["dhcp6", "Kea DHCPv6"], ["addon", "App"]];
const MAX_LOG_LINES = 1500;

// savedRevision is the version of the saved settings on the server; baseRevision is the version the editor (draft)
// was filled from. Saving sends baseRevision, so a change made elsewhere meanwhile is not silently overwritten.
let state = { status: null, saved: null, draft: null, leases: null, interfaces: null, ntp: {},
              savedRevision: null, baseRevision: null };
let agentState = null;                            // /api/agent: API settings, tokens, proposals, saved versions
let newSecret = null;                             // a token's secret, shown once right after it was created
const ntpCheck = {};                              // last "Check NTP servers" result per subnet editor
let importResult = null;                          // report of the last "Convert" of the old app's options
let tab = "dhcp4";
let dirty = false;
let busy = false;
const adv = {};                                   // which "advanced options" sections are open
const leaseView = { filter: "", key: "address", dir: 1 };
const logView = { source: "", since: 0, lines: [], auto: true, filter: "" };

// ------------------------------------------------------------- DOM helper
// Text is always set through textContent / properties, never innerHTML:
// hostnames in leases are chosen by network clients and must not be trusted.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

async function api(path, opts) {
  let res;
  try { res = await fetch(API(path), opts); }
  catch (e) { throw { errors: ["Cannot reach the app: " + e.message] }; }
  let body = null;
  try { body = await res.json(); } catch (e) { /* non-JSON error page */ }
  if (!res.ok) {
    const errors = (body && body.errors) || (body && body.error && [body.error]) ||
                   (body && body.detail && [typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)]) ||
                   ["HTTP " + res.status];
    throw { errors };
  }
  return body;
}
const sendJSON = (method, path, data) => api(path, {
  method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}),
});

// ------------------------------------------------------------- feedback
function showErrors(errors, kind) {
  const box = document.getElementById("banner");
  box.replaceChildren();
  if (!errors || !errors.length) return;
  box.append(h("div", { class: "banner " + (kind || "err") },
    kind === "warn" ? "Notice" : "Request failed", h("ul", {}, errors.map((e) => h("li", {}, e)))));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

let toastTimer = null;
function toast(message, kind) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast" + (kind === "err" ? " err" : "");
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

// ------------------------------------------------------------- draft model
const LIST_FIELDS = ["dns", "domain_search", "ntp_servers"];   // edited as comma separated text

function toDraft(settings) {
  const d = JSON.parse(JSON.stringify(settings));
  d.global = Object.assign({ interface: "eth0", enable_dhcp6: false, authoritative: false, allow_shared_ips: false }, d.global);
  for (const fam of ["dhcp4", "dhcp6"]) {
    d[fam] = d[fam] || { subnets: [] };
    for (const s of d[fam].subnets) {
      for (const f of LIST_FIELDS) if (Array.isArray(s[f])) s[f] = s[f].join(", ");
      s.pools = s.pools || [];
      s.custom_options = s.custom_options || [];
      s.reservations = s.reservations || [];
      if (fam === "dhcp6") s.pd_pools = s.pd_pools || [];
    }
  }
  return d;
}
// The save bar shows when there is something to save, and always on a fresh install: there the first Save & apply is
// what starts Kea, even if nothing in the editor had to be changed.
function updateSaveBar() {
  const waiting = !!(state.status && state.status.awaiting_setup);
  document.getElementById("savebar").hidden = !(dirty || waiting);
  document.getElementById("savemsg").textContent = dirty ? "You have unsaved changes"
    : "Nothing is served yet: check the settings, then click Save & apply to start Kea";
  document.getElementById("discard").hidden = !dirty;
}
function markDirty() { dirty = true; updateSaveBar(); }
function clearDirty() { dirty = false; updateSaveBar(); }

// ------------------------------------------------------------- formatting
function fmtDuration(sec) {
  if (sec == null) return "";
  if (sec < 60) return sec + " s";
  if (sec < 3600) return Math.floor(sec / 60) + " min";
  if (sec < 86400) return Math.floor(sec / 3600) + " h " + Math.floor((sec % 3600) / 60) + " min";
  return Math.floor(sec / 86400) + " d " + Math.floor((sec % 86400) / 3600) + " h";
}

// ------------------------------------------------------------- status + tabs
function renderStatus() {
  const bar = document.getElementById("statusbar");
  bar.replaceChildren();
  const st = state.status;
  if (!st) return;
  updateSaveBar();
  bar.append(h("span", { class: "muted" }, "Interface:"), h("b", {}, st.interface));
  for (const [key, label] of [["dhcp4", "DHCPv4"], ["dhcp6", "DHCPv6"]]) {
    const d = st.daemons[key];
    let text, cls = "";
    if (!d.enabled) text = "disabled";
    else if (!d.installed) text = "not installed";
    else if (d.running) { text = "running"; cls = "up"; }
    else { text = d.exit_code != null ? "stopped (exit " + d.exit_code + ")" : "not running"; cls = "down"; }
    bar.append(h("span", { class: "pill" }, h("span", { class: "dot " + cls }), label + ": " + text));
  }
  bar.append(h("span", { class: "grow" }),
    h("button", { onclick: onRestart, disabled: busy }, "Restart Kea"));
  // Daemon problems live in their own box so the 5s status refresh never
  // overwrites (or scrolls away from) validation errors from a save attempt.
  const kerr = document.getElementById("kerr");
  kerr.replaceChildren();
  if (st.storage_persistent === false)
    kerr.append(h("div", { class: "banner warn" },
      "Persistent storage is not mounted at /config, so settings and leases will be lost when the app restarts. " +
      "Update Home Assistant (and its Supervisor) to 2026.7.0 or newer, then restart the app."));
  if (st.awaiting_setup)
    kerr.append(h("div", { class: "banner warn" },
      "Kea is not running yet, and nothing is served, until you click Save & apply for the first time. Check the settings " +
      "first: the network interface (Settings tab) and the subnet (IPv4 tab), which is only an example." +
      (st.auto_interface ? " The default interface eth0 does not exist on this machine, so " + st.auto_interface +
        " (the interface of the default route) was filled in." : "")));
  if (st.last_error)
    kerr.append(h("div", { class: "banner err" }, "Kea problem\n" + st.last_error));
}

function renderTabs() {
  document.getElementById("tabs").replaceChildren(...TABS.map(([id, label]) =>
    h("button", { class: id === tab ? "active" : "", onclick: () => switchTab(id) }, label)));
}
function switchTab(id) { tab = id; renderTabs(); renderView(); }

// ------------------------------------------------------------- form widgets
function textInput(obj, key, opts) {
  return h("input", Object.assign({
    value: obj[key] == null ? "" : obj[key], autocomplete: "off", spellcheck: "false",
    oninput: (e) => { obj[key] = e.target.value; markDirty(); } }, opts || {}));
}
function field(label, obj, key, opts) { return h("div", {}, h("label", {}, label), textInput(obj, key, opts)); }
function delButton(onclick) { return h("button", { class: "danger sm", onclick }, "Delete"); }
function addButton(label, onclick) { return h("p", {}, h("button", { class: "sm", onclick }, label)); }
function tableOf(headers, rows, emptyText) {
  return h("div", { class: "scroll" }, h("table", {},
    h("thead", {}, h("tr", {}, headers.map((t) => h("th", {}, t)))),
    h("tbody", {}, rows.length ? rows : h("tr", {}, h("td", { colspan: headers.length, class: "muted" }, emptyText)))));
}
function rerender(fn) { return () => { fn(); markDirty(); renderView(); }; }

// ------------------------------------------------------------- subnet editor
function poolsEditor(s) {
  const rows = s.pools.map((p, i) => h("tr", {},
    h("td", {}, textInput(p, "start", { class: "mono" })),
    h("td", {}, textInput(p, "end", { class: "mono" })),
    h("td", {}, delButton(rerender(() => s.pools.splice(i, 1))))));
  return [h("h4", {}, "Address pools"),
          tableOf(["Start IP", "End IP", ""], rows, "No pools (only reservations will be served)"),
          addButton("+ Add pool", rerender(() => s.pools.push({ start: "", end: "" })))];
}

function reservationsEditor(fam, s) {
  const v4 = fam === "dhcp4", idKey = v4 ? "hw_address" : "duid";
  const rows = s.reservations.map((r, i) => h("tr", {},
    h("td", {}, textInput(r, idKey, { class: "mono", placeholder: v4 ? "aa:bb:cc:dd:ee:ff" : "00:01:00:01:..." })),
    h("td", {}, textInput(r, "ip_address", { class: "mono" })),
    h("td", {}, textInput(r, "hostname")),
    h("td", {}, delButton(rerender(() => s.reservations.splice(i, 1))))));
  return [h("h4", {}, "Reservations"),
          tableOf([v4 ? "MAC address" : "DUID", "Reserved IP", "Hostname (optional)", ""], rows, "No reservations yet"),
          addButton("+ Add reservation", rerender(() => s.reservations.push({ [idKey]: "", ip_address: "", hostname: "" })))];
}

// NTP servers: addresses or host names. The app resolves names itself every hour and sends only addresses that
// really answer as NTP servers (Kea cannot resolve names), so show what is sent and offer a live check.
function ntpField(fam, s, key) {
  const v4 = fam === "dhcp4";
  const names = String(s.ntp_servers || "").split(/[,\s]+/).filter(Boolean);
  const sent = [].concat(...names.map((n) => (state.ntp[n.replace(/\.$/, "").toLowerCase()] || {}).addresses || []));
  const notes = [];
  if (v4 && sent.length && names.some((n) => !/^[0-9.]+$/.test(n)))
    notes.push(h("div", { class: "muted small" }, "Addresses sent for the host names now: " + sent.join(", ")));
  if (!v4) notes.push(h("div", { class: "muted small" },
    "Host names are sent as names (clients look them up); many clients ignore DHCPv6 NTP servers."));
  const result = ntpCheck[key];
  const buttons = h("div", { class: "row" },
    h("button", { class: "sm", onclick: () => checkNtp(fam, s, key) }, "Check NTP servers"),
    h("button", { class: "sm", onclick: () => useThisMachine(fam, s) }, "Use this machine"),
    v4 ? h("button", { class: "sm", onclick: refreshNtp }, "Refresh addresses now") : null);
  return h("div", { class: "span" },
    h("label", {}, "NTP servers (comma separated)"),
    textInput(s, "ntp_servers", { placeholder: v4 ? "192.168.1.2, pool.ntp.org" : "2001:db8::123, pool.ntp.org" }),
    notes, buttons, result ? ntpResultView(result) : null);
}

function ntpResultView(res) {
  if (res.pending) return h("div", { class: "muted small" }, "Checking...");
  const rows = [];
  for (const srv of (res.report || { servers: [] }).servers) {
    if (srv.error) rows.push(h("tr", {}, h("td", {}, srv.server), h("td", {}), h("td", { class: "bad" }, srv.error), h("td", {}), h("td", {})));
    for (const a of srv.addresses) rows.push(h("tr", {},
      h("td", {}, srv.server === a.address ? "" : srv.server),
      h("td", { class: "mono" }, a.address),
      h("td", { class: a.ok ? "good" : "bad" }, a.ok ? "answers" : a.reason),
      h("td", {}, a.stratum == null ? "" : "stratum " + a.stratum),
      h("td", {}, a.rtt == null ? "" : Math.round(a.rtt * 1000) + " ms")));
  }
  return h("div", {},
    res.warning ? h("div", { class: "banner warn" }, res.warning) : null,
    tableOf(["Entry", "Address", "Result", "", ""], rows, "Nothing to check"),
    h("div", { class: "muted small" }, (res.usable || []).length + " usable address(es)."));
}

async function checkNtp(fam, s, key) {
  ntpCheck[key] = { pending: true }; renderView();
  const servers = String(s.ntp_servers || "").split(/[,\s]+/).filter(Boolean);
  try { ntpCheck[key] = await sendJSON("POST", "ntp/check", { servers, version: fam === "dhcp6" ? 6 : 4 }); }
  catch (e) { delete ntpCheck[key]; showErrors(e.errors); }
  renderView();
}

async function loadNtp() {
  try { state.ntp = await api("ntp"); } catch (e) { /* the note under the field is optional */ }
}

async function refreshNtp() {
  showErrors(null);
  try {
    const res = await sendJSON("POST", "ntp/refresh");
    await loadNtp(); renderView();
    toast(res.changed ? "NTP addresses changed and Kea reloaded." : "NTP addresses checked; no change.");
    if (res.warnings && res.warnings.length) showErrors(res.warnings, "warn");
  } catch (e) { showErrors(e.errors); }
}

async function useThisMachine(fam, s) {
  try {
    const res = await api("host-addresses");
    const found = fam === "dhcp6" ? res.ipv6 : res.ipv4;
    if (!found.length) { showErrors(["No " + (fam === "dhcp6" ? "IPv6" : "IPv4") + " address found on " + res.interface +
      ". Type the address of the machine that runs your NTP server."]); return; }
    s.ntp_servers = found[0]; markDirty(); renderView();
    toast("Set to " + found[0] + ". This works when an NTP server (for example the Chrony app) runs on this machine; use Check NTP servers to verify.");
  } catch (e) { showErrors(e.errors); }
}

function advancedEditor(fam, s, key) {
  const v4 = fam === "dhcp4";
  const fields = [];
  if (v4) fields.push(field("Domain name", s, "domain_name", { placeholder: "home.lan" }));
  fields.push(field("Search domains (comma separated)", s, "domain_search", { placeholder: "home.lan, lan" }));
  fields.push(ntpField(fam, s, key));

  const optRows = s.custom_options.map((o, i) => h("tr", {},
    h("td", {}, textInput(o, "name", { class: "mono", placeholder: "tftp-server-name" })),
    h("td", {}, textInput(o, "data", { class: "mono" })),
    h("td", {}, delButton(rerender(() => s.custom_options.splice(i, 1))))));
  const parts = [h("div", { class: "fields" }, fields),
    h("h4", {}, "Custom DHCP options"),
    h("div", { class: "muted small" }, "Kea option names (e.g. tftp-server-name, boot-file-name). Kea checks them when you apply."),
    tableOf(["Option name", "Data", ""], optRows, "No custom options"),
    addButton("+ Add option", rerender(() => s.custom_options.push({ name: "", data: "" })))];

  if (!v4) {
    const pdRows = s.pd_pools.map((p, i) => h("tr", {},
      h("td", {}, textInput(p, "prefix", { class: "mono", placeholder: "2001:db8:1::" })),
      h("td", {}, textInput(p, "prefix_len", { inputmode: "numeric", placeholder: "48" })),
      h("td", {}, textInput(p, "delegated_len", { inputmode: "numeric", placeholder: "64" })),
      h("td", {}, delButton(rerender(() => s.pd_pools.splice(i, 1))))));
    parts.push(h("h4", {}, "Prefix delegation pools"),
      tableOf(["Prefix", "Prefix length", "Delegated length", ""], pdRows, "No prefix delegation"),
      addButton("+ Add prefix pool", rerender(() => s.pd_pools.push({ prefix: "", prefix_len: "", delegated_len: "" }))));
  }
  return h("details", { open: !!adv[key], ontoggle: (e) => { adv[key] = e.target.open; } },
    h("summary", {}, "Advanced options"), parts);
}

function subnetCard(fam, subnets, idx) {
  const v4 = fam === "dhcp4";
  const s = subnets[idx];
  const fields = [field("Subnet (CIDR)", s, "subnet", { placeholder: v4 ? "192.168.1.0/24" : "fd00::/64" })];
  if (v4) fields.push(field("Default gateway", s, "router", { placeholder: "192.168.1.1" }));
  fields.push(field("DNS servers (comma separated)", s, "dns"),
              field("Lease time (seconds)", s, "lease_time", { inputmode: "numeric" }));
  if (v4) fields.push(field("Maximum lease time (seconds, optional)", s, "max_lease_time", { inputmode: "numeric", placeholder: "same as the lease time" }));
  return h("div", { class: "card" },
    h("div", { class: "row" },

function leaseCompare(a, b) {
  const k = leaseView.key;
  let x = a[k], y = b[k];
  if (k === "address") { x = a._i; y = b._i; }            // server already sorts addresses numerically
  if (typeof x === "string" || typeof y === "string") return String(x || "").localeCompare(String(y || ""), undefined, { numeric: true }) * leaseView.dir;
  return ((x == null ? -1 : x) - (y == null ? -1 : y)) * leaseView.dir;
}

// Adds a reservation for *lease* to the editor. Returns null, or the reason it was not added.
function addReservation(fam, lease) {
  const sub = state.draft[fam].subnets.find((s) => s.id === lease.subnet_id);
  if (!sub) return "its subnet (" + lease.subnet_id + ") is not in the editor";
  const key = fam === "dhcp4" ? "hw_address" : "duid";
  if (sub.reservations.some((r) => r[key] === lease.identifier)) return "this device already has a reservation";
  if (state.draft[fam].subnets.some((s) => s.reservations.some((r) => r.ip_address === lease.address)) &&
      !(fam === "dhcp4" && state.draft.global.allow_shared_ips)) return "this address is already reserved for another device";
  const name = lease.reserve_hostname != null ? lease.reserve_hostname : (lease.hostname || "").replace(/\.$/, "");
  sub.reservations.push({ [key]: lease.identifier, ip_address: lease.address, hostname: name });
  return null;
}

function isReserved(fam, lease) {
  const key = fam === "dhcp4" ? "hw_address" : "duid";
  const sharing = fam === "dhcp4" && state.draft.global.allow_shared_ips;
  const subs = state.draft[fam].subnets;
  return subs.some((s) => s.reservations.some((r) =>
    (s.id === lease.subnet_id && r[key] === lease.identifier) || (!sharing && r.ip_address === lease.address)));
}

function makeStatic(fam, lease) {
  const why = addReservation(fam, lease);
  if (why) { toast("Not added: " + why, "err"); return; }
  markDirty();
  switchTab(fam);
  toast("Reservation added to the editor. Review it, then click Save & apply.");
}

// Rows are ticked by default, except private (random) MAC addresses and what is already reserved; the user's own
// ticks are remembered per address.
const leaseTicks = { dhcp4: {}, dhcp6: {} };
function leaseTicked(fam, l) {
  if (l.kind !== "address" || isReserved(fam, l)) return false;
  return fam in leaseTicks && l.address in leaseTicks[fam] ? leaseTicks[fam][l.address] : !l.random_mac;
}

function reserveSelected(fam) {
  const chosen = (state.leases[fam] || []).filter((l) => leaseTicked(fam, l));
  if (!chosen.length) { toast("Nothing selected", "err"); return; }
  let added = 0;
  const skipped = [];
  for (const l of chosen) {
    const why = addReservation(fam, l);
    if (why) skipped.push(l.address + " (" + (l.identifier || "?") + "): " + why); else added++;
  }
  if (added) { markDirty(); switchTab(fam); }
  if (skipped.length) showErrors([added + " reservation(s) added; " + skipped.length + " skipped:"].concat(skipped), "warn");
  else toast(added + " reservation(s) added to the editor. Review them, then click Save & apply.");
}

async function deleteLease(fam, lease) {
  if (!confirm("Delete the lease for " + lease.address + "?\n\nKea is briefly stopped while the lease file is edited. The client keeps working until its lease runs out, then asks again.")) return;
  await setBusy(true);
  try { await sendJSON("DELETE", "leases/" + fam + "/" + encodeURIComponent(lease.address)); toast("Lease deleted"); }
  catch (e) { showErrors(e.errors); }
  await setBusy(false);
  await loadLeases(); refreshStatus();
}

function logLine(e) {
  const src = { dhcp4: "v4", dhcp6: "v6", addon: "app" }[e.source] || e.source;
  const cls = /\b(ERROR|FATAL)\b/.test(e.line) ? "err" : /\bWARN/.test(e.line) ? "warn" : "";
  return h("div", { class: cls }, h("span", { class: "src" }, "[" + src + "] "), e.line);
}
function logVisible(e) { return !logView.filter || e.line.toLowerCase().includes(logView.filter.toLowerCase()); }

function fillLogBox() {
  const box = document.getElementById("logbox");
  if (!box) return;
  const lines = logView.lines.filter(logVisible);
  box.replaceChildren(...(lines.length ? lines.map(logLine) : [h("div", { class: "muted" }, "No log lines yet")]));
  box.scrollTop = box.scrollHeight;
}

let logGeneration = 0;
async function pollLogs(reset) {
  if (reset) { logView.since = 0; logView.lines = []; logGeneration++; }
  const generation = logGeneration, since = logView.since;
  let data;
  try { data = await api("logs?since=" + since + "&source=" + encodeURIComponent(logView.source) + "&limit=500"); }
  catch (e) { return; }
  if (generation !== logGeneration || since !== logView.since) return;     // a newer request already took over
  logView.since = data.last_seq;
  if (!data.entries.length && !reset) return;
  const box = document.getElementById("logbox");
  const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  logView.lines = logView.lines.concat(data.entries).slice(-MAX_LOG_LINES);
  if (!box) return;
  if (reset || !box.querySelector("div:not(.muted)")) { fillLogBox(); return; }
  for (const e of data.entries.filter(logVisible)) box.append(logLine(e));
  while (box.childElementCount > MAX_LOG_LINES) box.firstChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// Copy text to the clipboard. navigator.clipboard only exists on HTTPS pages (and localhost); Home Assistant is very
// often opened as http://<address>:8123, where it is undefined, so fall back to the old selection-based command.
// Resolves to false when nothing worked, and the caller must say so: a "Copied" that did not copy is worse than none.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* not allowed here: try the other way */ }
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.append(area);
  let done = false;
  try { area.select(); area.setSelectionRange(0, text.length); done = document.execCommand("copy"); }
  catch (e) { done = false; }
  area.remove();
  return done;
}

function selectText(el) {
  if (!el) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
}

            ifaces.length ? "Detected: " + ifaces.join(", ") + (def ? " (default route: " + def + ")" : "") : "No interfaces detected")),
        h("div", {}, h("label", {}, "DHCPv6"),
          h("label", { class: "check" },
            h("input", Object.assign({ type: "checkbox", onchange: (e) => { g.enable_dhcp6 = e.target.checked; markDirty(); } },
              g.enable_dhcp6 ? { checked: true } : {})), "Enable DHCPv6 server")),
        h("div", {}, h("label", {}, "DHCPv4 behaviour"),
          checkRow(g, "authoritative", "Answer clients that ask for an unknown address",
            "Kea then tells a client that its remembered address is not valid here, so it asks for a new one at once instead of waiting. Turn on if this is the only DHCP server on the network."),
          checkRow(g, "allow_shared_ips", "Allow several devices to share one IP",
            "For a device with a wired and a wireless interface: two MAC addresses, one reserved IP. Only one of them should be connected at a time."))),
      h("div", { class: "muted small" }, "Changing the interface restarts Kea. Turning DHCPv6 on or off only starts or stops the DHCPv6 service. Every other change is applied by reloading Kea, so running leases are not interrupted. The values in the app's Configuration tab are only the initial defaults.")),
    h("div", { id: "agentbox" }), h("div", { id: "agentpending" }),
    h("div", { class: "card" },
      h("h3", {}, "Import from the DHCP server app"),
      h("p", { class: "muted" }, "Coming from the Home Assistant \"DHCP server\" app (ISC dhcpd)? Open that app's Configuration tab, switch to YAML, copy everything and paste it here. Your networks, devices, DNS, NTP and lease times are converted into the editor; nothing changes until you click Save & apply. Existing leases are not carried over."),
      h("textarea", { id: "oldapp", rows: "8", spellcheck: "false", class: "mono", style: "width:100%", placeholder: "default_lease: 3600\nnetworks:\n  - subnet: 192.168.1.0\n    ..." }),
      h("p", {}, h("button", { onclick: onConvert }, "Convert and load")),
      importReportView(importResult)),
    h("div", { class: "card" },
      h("h3", {}, "Backup & restore"),
      h("p", { class: "muted" }, "Export downloads the saved settings. Import loads a settings file into the editor so you can review it; nothing changes until you click Save & apply."),
      h("div", { class: "row" },
        h("a", { class: "btn", href: "api/backup", download: "kea-settings.json" }, "Export settings"),
        h("label", { class: "btn", style: "margin:0;color:var(--fg);font-size:14px" }, "Import settings…",
          h("input", { type: "file", accept: "application/json,.json", hidden: true, onchange: onImport })))));
}

async function onImport(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  showErrors(null);
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch (err) { showErrors(["The file is not valid JSON"]); return; }
  try {
    const res = await sendJSON("POST", "import", parsed);
    state.draft = toDraft(res.settings);
    markDirty(); renderView();
    toast("Settings loaded into the editor. Review them, then click Save & apply.");
  } catch (err) { showErrors(err.errors); }
}

// ------------------------------------------------------------- view dispatch
function renderView() {
  if (!state.draft) return;
  if (tab === "leases") renderLeases();
  else if (tab === "logs") renderLogs();
  else if (tab === "settings") { renderSettings(); renderAgentConfig(); renderAgentPending(); loadAgent(); }
  else renderFamily(tab);
}

// ------------------------------------------------------------- actions
async function loadAll() {
  const data = await api("state");
  state.status = data.status;
  state.saved = data.settings;
  state.savedRevision = data.revision;
  if (!dirty) { state.draft = toDraft(data.settings); state.baseRevision = data.revision; }
  renderStatus(); renderView();
}
async function loadLeases() {
  try { state.leases = await api("leases"); } catch (e) { showErrors(e.errors); }
  renderLeaseTables();
}
async function refreshStatus() {
  try { state.status = await api("status"); renderStatus(); } catch (e) { /* transient */ }
}
async function setBusy(on) {
  busy = on;
  // Inputs too: text typed while a save is in flight would be replaced by the saved settings afterwards.
  for (const el of document.querySelectorAll("button, input, select")) if (!el.dataset.locked) el.disabled = on;
}

function applyMessage(res) {
  const c = res.changes || {};
  if ((c.started || []).includes("dhcp4")) return "Applied. Kea was started.";
  if (res.action === "restarted") return "Applied. Kea was restarted.";
  const notes = [];
  if ((c.started || []).includes("dhcp6")) notes.push("DHCPv6 was started.");
  if ((c.stopped || []).includes("dhcp6")) notes.push("DHCPv6 was stopped.");
  return ["Applied. Kea reloaded its configuration without restarting."].concat(notes).join(" ");
}

document.getElementById("save").addEventListener("click", async () => {
  showErrors(null);
  await setBusy(true);
  try {
    const res = await sendJSON("PUT", "settings" + (state.baseRevision ? "?revision=" + encodeURIComponent(state.baseRevision) : ""), state.draft);
    state.saved = res.settings; state.draft = toDraft(res.settings); state.status = res.status;
    state.savedRevision = state.baseRevision = res.revision;
    clearDirty();
    await loadNtp();
    toast(applyMessage(res));
    if (res.warnings && res.warnings.length) showErrors(res.warnings, "warn");
  } catch (e) { showErrors(e.errors); }
  await setBusy(false);
  renderStatus(); renderView();
});

document.getElementById("discard").addEventListener("click", () => {
  if (!confirm("Discard all unsaved changes?")) return;
  clearDirty(); showErrors(null);
  loadAll().catch((e) => showErrors(e.errors));       // from the server, not from memory: it may have changed meanwhile
});

async function onRestart() {
  if (dirty && !confirm("You have unsaved changes. Restarting only applies the saved settings. Continue?")) return;
  showErrors(null);
  await setBusy(true);
  try { state.status = (await sendJSON("POST", "restart")).status; toast("Kea restarted"); }
  catch (e) { showErrors(e.errors); }
  await setBusy(false);
  renderStatus();
}

// ------------------------------------------------------------- boot
(async function init() {
  renderTabs();
  try { await loadAll(); } catch (e) { showErrors(e.errors); }
  loadNtp().then(renderView);
  api("interfaces").then((r) => { state.interfaces = r; if (tab === "settings") renderView(); }).catch(() => {});
  loadLeases();
  setInterval(() => { if (!document.hidden && !busy) refreshStatus(); }, 5000);
  setInterval(() => { if (!document.hidden && tab === "leases") loadLeases(); }, 10000);
  setInterval(() => { if (!document.hidden && tab === "settings" && !busy) loadAgentPending(); }, 10000);
  setInterval(() => { if (!document.hidden && tab === "logs" && logView.auto) pollLogs(false); }, 2000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshStatus(); });
})();
</script>
</body>
</html>
